<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio — GTA-style cover art maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover editor">
    <h1>Neon Coast Cover Studio</h1>
    <p class="tagline">Your photo + a caption = GTA-style cover art. Works offline; photos never leave your machine.</p>

    <div class="group">
      <h2>1 · Photos</h2>
      <label class="file">Add your photos <input id="photo" type="file" accept="image/*" multiple></label>
      <div class="row">
        <button id="samplePier" type="button" data-sample="pier">Sample: Pier</button>
        <button id="sampleBoulevard" type="button" data-sample="boulevard">Sample: Boulevard</button>
      </div>
      <div id="photos" class="tray" aria-label="Loaded photos"></div>
      <label class="check"><input id="fillOne" type="checkbox"> One photo fills every panel</label>
    </div>

    <div class="group">
      <h2>2 · Layout</h2>
      <div class="row wrap">
        <button type="button" data-layout="nine">Nine-Panel Grid</button>
        <button type="button" data-layout="hero">Hero and Three</button>
        <button type="button" data-layout="bleed">Full Bleed</button>
        <button type="button" data-layout="tilted">Tilted Snapshots</button>
      </div>
      <div id="slots" class="tray" aria-label="Panels"></div>
      <label>Zoom selected panel <input id="zoom" type="range" min="100" max="250" value="100"></label>
      <p class="hint">Click a panel on the cover to select it, then drag to move its photo.</p>
    </div>

    <div class="group">
      <h2>3 · Grade</h2>
      <div id="grades" class="row wrap" aria-label="Colour grades"></div>
    </div>

    <div class="group">
      <h2>4 · Words</h2>
      <label>Title <input id="caption" type="text" maxlength="40" value="NEON COAST"></label>
      <label>Subtitle (neon script) <input id="subtitle" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Footer line (grid layouts) <input id="footer" type="text" maxlength="48" value="EST. 2026 — NEON COAST"></label>
      <div class="row heat" aria-label="Heat meter">
        <span>Heat</span>
        <button type="button" data-heat="1" aria-label="Heat 1 star">★</button>
        <button type="button" data-heat="2" aria-label="Heat 2 stars">★</button>
        <button type="button" data-heat="3" aria-label="Heat 3 stars">★</button>
        <button type="button" data-heat="4" aria-label="Heat 4 stars">★</button>
        <button type="button" data-heat="5" aria-label="Heat 5 stars">★</button>
      </div>
    </div>

    <div class="group">
      <h2>5 · Finish</h2>
      <label class="check"><input id="badge" type="checkbox" checked> Badge ribbon</label>
      <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
    </div>

    <div class="group">
      <h2>6 · Export</h2>
      <div class="row wrap">
        <button type="button" data-preview="square">Square preview</button>
        <button type="button" data-preview="portrait">Portrait preview</button>
        <button type="button" data-preview="wide">Wide preview</button>
      </div>
      <button id="exportAll" type="button" class="primary">Export all 3 sizes (PNG)</button>
      <div class="row wrap">
        <button type="button" data-size="square">1080 × 1080</button>
        <button type="button" data-size="portrait">1080 × 1350</button>
        <button type="button" data-size="wide">1920 × 1080</button>
      </div>
      <p id="status" role="status"></p>
    </div>
  </section>
  <section class="stage">
    <canvas id="cover" width="720" height="720" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
